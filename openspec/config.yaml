schema: spec-driven

context: |
  Language: 简体中文
  All artifacts must be written in 简体中文.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  This repository is the 2026 riscv64 ucore operating-system lab, with one skeleton per chapter.
  lab-status.json is the source of truth for the current and frozen chapters.
  Experiment implementation may change only the current chapter and must never change a frozen chapter.
  Follow AGENTS.md branch conventions: experiment dev is Dev/LabX/UserName/branch, stable is Dev/LabX/main, and release is root-level LabX; X matches the current chapter.
  Experiment pull requests flow dev to stable to release. Ordinary non-experiment maintenance uses Dev/* with main as its pull request target; pure document/LaTeX edits do not require a developer hierarchy.
  Branch conventions do not authorize branch creation, commits, archives, or pushes. Reuse the user's explicit scope authority for those operations.
  OpenSpec artifacts, change-level prompt evidence, governance rules, CI, and repository documentation are workflow metadata and may be changed within the authorized request.
  Follow AGENTS.md routing before selecting a workflow: explicit implementation approval or a quick/direct edit request authorizes direct execution of that scope without another apply message or mandatory planning artifacts.
  Routine fixes restoring existing behavior and document/LaTeX edits use direct maintenance without creating a change.
  Substantial new requirements without direct implementation authority use OpenSpec planning and wait for implementation approval only when that authority is still missing.
  Implementation authority persists across tasks and turns; complete in-scope fixes, validation retries, local design adjustments, and artifact/document updates without repeated approval.
  Confirm only unapproved requirement or scope increments; a user's explicit direct implementation request already authorizes the named increment.
  Archiving and committing require explicit authority, which may be granted together with implementation in one message; never request an applicable approval again.
  Specs describe observable behavior, preconditions, postconditions, and results rather than implementation recipes.
  Specs cover only behavior touched by the change and do not backfill the whole kernel.
  Prompt evidence belongs only in the current change's prompt.md.
  Save only exact user messages that directly affect that change and contain no sensitive values.
  If a relevant message contains any sensitive value, save no version of its text and record only a content-free omission marker.
  Do not enumerate, search, read, or migrate prompt evidence from other changes or legacy session archives.

rules:
  proposal:
    - State the scope and explicit non-goals.
  design:
    - Record security and privacy tradeoffs when the change handles user-provided content.
  tasks:
    - Include deterministic verification commands and external prerequisites.

operations:
  apply:
    guidance:
      - Implement the authorized requirement scope and keep tasks coherent; continue routine maintenance without repeated approval.
      - Honor explicit implementation approval and quick/direct edit requests; ask only about unapproved scope increments or decisions that block progress.
      - Report missing external toolchains as unmet environment conditions; do not claim success.
  archive:
    guidance:
      - Archive only after explicit user authorization and successful validation.
      - Reuse existing archive authority including normal spec sync; ask only about unresolved conflicts or unapproved exceptions.
